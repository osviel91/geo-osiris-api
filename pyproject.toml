[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "osiris-geo-api"
version = "0.1.0"
description = "Small GeoJSON API for OSIRIS custom layers"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.15.2",
  "fastapi==0.115.12",
  "geoalchemy2==0.17.1",
  "psycopg[binary]==3.2.6",
  "sqlalchemy==2.0.40",
  "uvicorn==0.34.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==8.3.5",
  "ruff==0.11.2",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests", "publisher"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

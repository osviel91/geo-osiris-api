name: osiris-staging

services:
  postgis:
    image: postgis/postgis:16-3.4
    platform: linux/amd64
    restart: unless-stopped
    environment:
      POSTGRES_DB: osiris
      POSTGRES_USER: osiris
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgis-staging-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U osiris -d osiris"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - osiris-staging

  geo-api:
    image: ${GEO_API_IMAGE:-geo-osiris-api:sha-0ef6d4a}
    platform: linux/amd64
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      LOG_LEVEL: INFO
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # ADMIN_API_TOKEN remains a temporary full-admin compatibility credential.
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
      GEO_READ_TOKEN: ${GEO_READ_TOKEN:-}
      GEO_STAGE_TOKEN: ${GEO_STAGE_TOKEN:-}
      GEO_APPROVE_TOKEN: ${GEO_APPROVE_TOKEN:-}
      GEO_PUBLISH_TOKEN: ${GEO_PUBLISH_TOKEN:-}
      GEO_ADMIN_TOKEN: ${GEO_ADMIN_TOKEN:-}
      APPROVAL_TTL_MINUTES: ${APPROVAL_TTL_MINUTES:-60}
      AEMET_API_KEY: ${AEMET_API_KEY:-}
      DATABASE_URL: postgresql+psycopg://osiris:${POSTGRES_PASSWORD:?}@postgis:5432/osiris
    depends_on:
      postgis:
        condition: service_healthy
    networks:
      - osiris-staging

  # Docker-internal only. Reached exclusively through admin-proxy, which
  # performs Authelia forward-auth and injects trusted identity headers.
  geo-admin:
    image: ${GEO_ADMIN_IMAGE:-geo-osiris-admin:sha-0926b36}
    platform: linux/amd64
    restart: unless-stopped
    environment:
      GEO_API_URL: http://geo-api:8000
      GEO_ADMIN_TOKEN: ${GEO_ADMIN_TOKEN:?GEO_ADMIN_TOKEN is required}
      # Server-side only, used exclusively by the approval decision path.
      GEO_APPROVE_TOKEN: ${GEO_APPROVE_TOKEN:?GEO_APPROVE_TOKEN is required}
      ADMIN_PROXY_SECRET: ${ADMIN_PROXY_SECRET:?ADMIN_PROXY_SECRET is required}
      AUTHELIA_PORTAL_URL: https://auth.osiris.home.arpa/
    depends_on:
      - geo-api
    networks:
      - osiris-staging

  authelia:
    image: authelia/authelia:4.38
    restart: unless-stopped
    environment:
      AUTHELIA_SESSION_SECRET: ${AUTHELIA_SESSION_SECRET:?AUTHELIA_SESSION_SECRET is required}
      AUTHELIA_STORAGE_ENCRYPTION_KEY: ${AUTHELIA_STORAGE_ENCRYPTION_KEY:?AUTHELIA_STORAGE_ENCRYPTION_KEY is required}
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET: ${AUTHELIA_JWT_SECRET:?AUTHELIA_JWT_SECRET is required}
      TZ: UTC
    volumes:
      - ./authelia/configuration.yml:/config/configuration.yml:ro
      - ./authelia/users_database.yml:/config/users_database.yml:ro
      - authelia-staging-data:/data
    networks:
      - osiris-staging

  # The only published surface. Terminates TLS, runs Authelia forward-auth for
  # geo-admin, strips client identity headers, and injects trusted ones.
  admin-proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      ADMIN_PROXY_SECRET: ${ADMIN_PROXY_SECRET:?ADMIN_PROXY_SECRET is required}
    volumes:
      - ./proxy/geo-admin.conf.template:/etc/nginx/templates/geo-admin.conf.template:ro
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "127.0.0.1:${ADMIN_HTTPS_PORT:-443}:443"
    depends_on:
      - authelia
      - geo-admin
    networks:
      - osiris-staging

  osiris:
    image: ${OSIRIS_IMAGE:-osiris:sha-a353dce}
    platform: linux/amd64
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      GEO_API_ENABLED: "true"
      GEO_API_URL: http://geo-api:8000
    ports:
      - "${OSIRIS_PORT:-3000}:3000"
    depends_on:
      - geo-api
    networks:
      - osiris-staging

  # Narrow publication executor. Holds only the publish credential, exposes no
  # port, and runs as an idle non-root container driven by `docker exec`.
  geo-publisher:
    image: ${GEO_PUBLISHER_IMAGE:-geo-osiris-publisher:phase-6c}
    platform: linux/amd64
    restart: unless-stopped
    entrypoint: ["sleep", "infinity"]
    environment:
      GEO_API_URL: http://geo-api:8000
      GEO_PUBLISH_TOKEN: ${GEO_PUBLISH_TOKEN:?GEO_PUBLISH_TOKEN is required}
    depends_on:
      - geo-api
    networks:
      - osiris-staging

volumes:
  postgis-staging-data:
  authelia-staging-data:

networks:
  osiris-staging:
    driver: bridge

name: Publish images

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: API image metadata
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/osviel91/geo-osiris-api
          tags: |
            type=sha,prefix=sha-,format=short

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}

      - name: Publisher image metadata
        id: meta-publisher
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/osviel91/geo-osiris-publisher
          tags: |
            type=sha,prefix=sha-,format=short

      - name: Build and push publisher image
        uses: docker/build-push-action@v6
        with:
          context: ./publisher
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-publisher.outputs.tags }}
          labels: ${{ steps.meta-publisher.outputs.labels }}

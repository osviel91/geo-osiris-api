name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: osiris
          POSTGRES_USER: osiris
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd "pg_isready -U osiris -d osiris"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ".[dev]"
      - run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://osiris:test@localhost:5432/osiris
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
        env:
          DATABASE_URL: postgresql+psycopg://osiris:test@localhost:5432/osiris
          TEST_DATABASE_URL: postgresql+psycopg://osiris:test@localhost:5432/osiris
      - run: docker build -t osiris-geo-api:test .
